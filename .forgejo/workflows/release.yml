name: Release

on:
  push:
    branches:
      - main  # update here if the default branch changes
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu
    outputs:
      tag: ${{ steps.pushed.outputs.tag || steps.bump.outputs.tag }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use pushed tag
        if: github.ref_type == 'tag'
        id: pushed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "ERROR: tag ${TAG} is not vMAJOR.MINOR.PATCH"
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compute next patch version and push tag
        if: github.ref_type == 'branch'
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags

          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$LATEST" ]; then
            NEXT="v0.1.0"
          else
            MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "Latest tag: ${LATEST:-none}, next: ${NEXT}"
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply"
          git tag "$NEXT"
          git push origin "$NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    runs-on: ubuntu
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          go build -ldflags="-s -w -X main.Version=${TAG}" \
            -o hist-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/hist

      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: hist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: hist-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: [tag, build]
    runs-on: ubuntu
    steps:
      - name: Download linux-amd64
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: hist-linux-amd64
          path: dist/release

      - name: Download linux-arm64
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: hist-linux-arm64
          path: dist/release

      - name: Create release and upload binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API_BASE="${SERVER_URL}/api/v1"

          RELEASE=$(curl -sf "${API_BASE}/repos/${REPO}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITHUB_TOKEN}" || true)
          RELEASE_ID=$(echo "$RELEASE" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)

          if [ -z "$RELEASE_ID" ]; then
            HTTP_CODE=$(curl -s -o /tmp/release_response.json -w "%{http_code}" -X POST \
              "${API_BASE}/repos/${REPO}/releases" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"${TAG}\", \"name\": \"${TAG}\"}")
            [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] || {
              echo "ERROR: POST failed (HTTP ${HTTP_CODE}): $(cat /tmp/release_response.json)"
              exit 1
            }
            RELEASE=$(cat /tmp/release_response.json)
            RELEASE_ID=$(echo "$RELEASE" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: could not get or create release for tag ${TAG}"
            exit 1
          fi

          echo "Release ID: ${RELEASE_ID}"

          for f in dist/release/*; do
            echo "Uploading $(basename "${f}")..."
            curl -sfS -X POST \
              "${API_BASE}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "${f}")" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}"
          done

  mirror-github-release:
    needs: [tag, build, release]
    runs-on: ubuntu
    steps:
      - name: Download linux-amd64
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: hist-linux-amd64
          path: dist/release

      - name: Download linux-arm64
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: hist-linux-arm64
          path: dist/release

      - name: Create GitHub release and upload binaries
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          GH_REPO: pbuller212/enhanced-history
        run: |
          set -euo pipefail

          if [ -z "${GH_RELEASE_TOKEN:-}" ]; then
            echo "WARNING: secrets.GH_RELEASE_TOKEN is not set; skipping GitHub release mirror."
            exit 0
          fi

          GH_API="https://api.github.com"
          AUTH_HEADER="Authorization: Bearer ${GH_RELEASE_TOKEN}"

          # Reuse the title and notes from the Forgejo release.
          FORGEJO_RELEASE=$(curl -sf "${SERVER_URL}/api/v1/repos/${REPO}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITHUB_TOKEN}")
          RELEASE_NAME=$(echo "$FORGEJO_RELEASE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name") or "")')
          RELEASE_BODY=$(echo "$FORGEJO_RELEASE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("body") or "")')
          [ -n "$RELEASE_NAME" ] || RELEASE_NAME="${TAG}"

          # Idempotency: look up by tag first, in case this job re-runs.
          HTTP_CODE=$(curl -s -o /tmp/gh_release_lookup.json -w "%{http_code}" \
            "${GH_API}/repos/${GH_REPO}/releases/tags/${TAG}" \
            -H "${AUTH_HEADER}" \
            -H "Accept: application/vnd.github+json")

          if [ "$HTTP_CODE" -eq 200 ]; then
            RELEASE_JSON=/tmp/gh_release_lookup.json
          elif [ "$HTTP_CODE" -eq 404 ]; then
            # The push mirror may not have delivered the tag yet; GitHub
            # creates it from target_commitish if it is missing.
            PAYLOAD=$(RELEASE_NAME="$RELEASE_NAME" RELEASE_BODY="$RELEASE_BODY" TAG="$TAG" TARGET="${GITHUB_SHA:-}" \
              python3 -c 'import json,os; print(json.dumps({"tag_name": os.environ["TAG"], "target_commitish": os.environ["TARGET"], "name": os.environ["RELEASE_NAME"], "body": os.environ["RELEASE_BODY"]}))')
            HTTP_CODE=$(curl -s -o /tmp/gh_release_create.json -w "%{http_code}" -X POST \
              "${GH_API}/repos/${GH_REPO}/releases" \
              -H "${AUTH_HEADER}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}")
            [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] || {
              echo "ERROR: GitHub release POST failed (HTTP ${HTTP_CODE}): $(cat /tmp/gh_release_create.json)"
              exit 1
            }
            RELEASE_JSON=/tmp/gh_release_create.json
          else
            echo "ERROR: unexpected HTTP ${HTTP_CODE} looking up GitHub release for tag ${TAG}: $(cat /tmp/gh_release_lookup.json)"
            exit 1
          fi

          GH_RELEASE_ID=$(RELEASE_JSON="$RELEASE_JSON" python3 -c 'import json,os; print(json.load(open(os.environ["RELEASE_JSON"]))["id"])')
          # Assets go to uploads.github.com; use the upload_url from the
          # release response, minus its trailing {?name,label} template.
          UPLOAD_URL=$(RELEASE_JSON="$RELEASE_JSON" python3 -c 'import json,os; print(json.load(open(os.environ["RELEASE_JSON"]))["upload_url"].split("{")[0])')

          echo "GitHub release ID: ${GH_RELEASE_ID}"

          # Skip assets already uploaded so re-runs don't fail on duplicates.
          EXISTING_ASSETS=$(curl -sf "${GH_API}/repos/${GH_REPO}/releases/${GH_RELEASE_ID}/assets" \
            -H "${AUTH_HEADER}" -H "Accept: application/vnd.github+json" \
            | python3 -c 'import json,sys; print("\n".join(a["name"] for a in json.load(sys.stdin)))')

          for f in dist/release/*; do
            NAME=$(basename "${f}")
            if echo "$EXISTING_ASSETS" | grep -qx "$NAME"; then
              echo "Skipping ${NAME} (already uploaded to GitHub release)"
              continue
            fi
            echo "Uploading ${NAME} to GitHub..."
            curl -sfS -X POST "${UPLOAD_URL}?name=${NAME}" \
              -H "${AUTH_HEADER}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}"
          done
